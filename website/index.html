<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wind Rises - Une expérience de vol paisible et contemplative. Laissez-vous porter par le vent dans ce jeu chill et reposant.">
    <meta name="keywords" content="Wind Rises, jeu de vol, jeu chill, jeu relaxant, simulation de vol, jeu cozy">
    <meta name="author" content="Wind Rises">
    <meta name="theme-color" content="#667eea">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wind Rises - Laissez-vous porter par le vent">
    <meta property="og:description" content="Une expérience de vol paisible et contemplative. Découvrez des paysages sereins dans ce jeu chill et reposant.">
    <meta property="og:site_name" content="Wind Rises">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Wind Rises - Laissez-vous porter par le vent">
    <meta property="twitter:description" content="Une expérience de vol paisible et contemplative.">

    <title>Wind Rises - Laissez-vous porter par le vent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Effet vignette */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 40%,
                rgba(0, 0, 0, 0.3) 80%,
                rgba(0, 0, 0, 0.6) 100%
            );
            z-index: 100;
            transition: all 0.8s ease-in-out;
        }

        /* Vignette plus douce en thème clair */
        body.light-theme::after {
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 50%,
                rgba(135, 206, 250, 0.15) 85%,
                rgba(100, 150, 200, 0.3) 100%
            );
        }

        /* Animation du fond dégradé crépusculaire */
        @keyframes twilightShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                180deg,
                #1a1347 0%,
                #2d1b4e 15%,
                #4a2c5e 30%,
                #6b3d6f 45%,
                #8b4d7a 60%,
                #a85f82 75%,
                #c17287 85%,
                #d9856f 95%,
                #f09a5b 100%
            );
            background-size: 400% 400%;
            animation: twilightShift 30s ease infinite;
            z-index: 0;
        }

        /* Effet de brume */
        @keyframes mistFloat {
            0%, 100% {
                transform: translateX(0) translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateX(30px) translateY(-20px);
                opacity: 0.6;
            }
        }

        .mist {
            position: absolute;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: mistFloat ease-in-out infinite;
            filter: blur(40px);
        }

        .mist-1 {
            width: 600px;
            height: 200px;
            top: 20%;
            left: -10%;
            animation-duration: 25s;
        }

        .mist-2 {
            width: 500px;
            height: 180px;
            top: 60%;
            right: -5%;
            animation-duration: 30s;
            animation-delay: -10s;
        }

        .mist-3 {
            width: 450px;
            height: 150px;
            bottom: 10%;
            left: 30%;
            animation-duration: 28s;
            animation-delay: -5s;
        }

        /* ============================================ */
        /* ANIMATIONS GLOBALES */
        /* ============================================ */

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(3deg); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-35px); }
        }

        @keyframes drift {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -300% center; }
            100% { background-position: 300% center; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes floatGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }


        /* ============================================ */
        /* ÉLÉMENTS DE DÉCOR */
        /* ============================================ */

        /* Nuages sombres */
        .cloud {
            position: absolute;
            background: rgba(20, 15, 40, 0.4);
            border-radius: 100px;
            animation: drift linear infinite;
            pointer-events: none;
            filter: blur(2px);
            box-shadow: inset 0 -10px 30px rgba(0, 0, 0, 0.3);
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(20, 15, 40, 0.4);
            border-radius: 100px;
        }

        .cloud-1 {
            width: 120px;
            height: 60px;
            top: 15%;
            animation-duration: 50s;
        }

        .cloud-1::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 15px;
        }

        .cloud-1::after {
            width: 70px;
            height: 50px;
            top: -20px;
            right: 15px;
        }

        .cloud-2 {
            width: 160px;
            height: 80px;
            top: 50%;
            animation-duration: 60s;
            animation-delay: -15s;
        }

        .cloud-2::before {
            width: 80px;
            height: 80px;
            top: -40px;
            left: 25px;
        }

        .cloud-2::after {
            width: 90px;
            height: 70px;
            top: -30px;
            right: 25px;
        }

        .cloud-3 {
            width: 140px;
            height: 70px;
            top: 75%;
            animation-duration: 55s;
            animation-delay: -30s;
        }

        .cloud-3::before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 20px;
        }

        .cloud-3::after {
            width: 80px;
            height: 60px;
            top: -25px;
            right: 20px;
        }

        /* Lucioles / Fireflies */
        @keyframes firefly {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            50% {
                transform: translateY(-80px) translateX(40px);
            }
        }

        .firefly {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            animation: firefly ease-in-out infinite;
            box-shadow:
                0 0 10px #ffd700,
                0 0 20px #ffd700,
                0 0 30px rgba(255, 215, 0, 0.5);
            will-change: transform, opacity;
        }

        .firefly-1 { bottom: 20%; left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .firefly-2 { bottom: 30%; left: 25%; animation-duration: 7s; animation-delay: 1s; }
        .firefly-3 { bottom: 15%; left: 40%; animation-duration: 6.5s; animation-delay: 2s; }
        .firefly-4 { bottom: 25%; left: 55%; animation-duration: 8s; animation-delay: 0.5s; }
        .firefly-5 { bottom: 35%; left: 70%; animation-duration: 7.5s; animation-delay: 1.5s; }
        .firefly-6 { bottom: 20%; left: 85%; animation-duration: 6.8s; animation-delay: 2.5s; }
        .firefly-7 { bottom: 40%; left: 15%; animation-duration: 7.2s; animation-delay: 3s; }
        .firefly-8 { bottom: 18%; left: 60%; animation-duration: 6.3s; animation-delay: 3.5s; }

        /* Particules lumineuses dorées */
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.8) 0%, rgba(255, 150, 50, 0.4) 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatSlow ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 200, 100, 0.6);
            will-change: transform;
        }

        .particle-1 { width: 6px; height: 6px; top: 12%; left: 18%; animation-duration: 9s; animation-delay: 0s; }
        .particle-2 { width: 10px; height: 10px; top: 28%; left: 82%; animation-duration: 11s; animation-delay: 1s; }
        .particle-3 { width: 5px; height: 5px; top: 45%; left: 28%; animation-duration: 8s; animation-delay: 2s; }
        .particle-4 { width: 8px; height: 8px; top: 58%; left: 75%; animation-duration: 10s; animation-delay: 0.5s; }
        .particle-5 { width: 7px; height: 7px; top: 72%; left: 45%; animation-duration: 9.5s; animation-delay: 1.5s; }
        .particle-6 { width: 6px; height: 6px; top: 18%; left: 55%; animation-duration: 12s; animation-delay: 3s; }
        .particle-7 { width: 9px; height: 9px; top: 82%; left: 65%; animation-duration: 8.5s; animation-delay: 2.5s; }
        .particle-8 { width: 11px; height: 11px; top: 35%; left: 12%; animation-duration: 10.5s; animation-delay: 1.8s; }

        /* Oiseaux avec silhouette nocturne */
        @keyframes fly {
            0% { transform: translateX(-100px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-40px); }
            100% { transform: translateX(calc(100vw + 100px)) translateY(0); }
        }

        @keyframes wing {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.3); }
        }

        .bird {
            position: absolute;
            width: 40px;
            height: 20px;
            animation: fly linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }

        .bird::before,
        .bird::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 2px;
            animation: wing ease-in-out infinite;
        }

        .bird::before {
            top: 0;
            left: 0;
            transform-origin: right center;
            transform: rotate(-30deg);
        }

        .bird::after {
            top: 0;
            right: 0;
            transform-origin: left center;
            transform: rotate(30deg);
        }

        .bird-1 {
            top: 18%;
            animation-duration: 28s;
            animation-delay: 0s;
        }

        .bird-1::before,
        .bird-1::after {
            animation-duration: 0.5s;
        }

        .bird-2 {
            top: 38%;
            animation-duration: 33s;
            animation-delay: -12s;
        }

        .bird-2::before,
        .bird-2::after {
            animation-duration: 0.6s;
        }

        .bird-3 {
            top: 58%;
            animation-duration: 30s;
            animation-delay: -8s;
        }

        .bird-3::before,
        .bird-3::after {
            animation-duration: 0.55s;
        }

        /* Lueurs crépusculaires */
        @keyframes glowTwilight {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1) rotate(0deg);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.3) rotate(10deg);
            }
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: glowTwilight ease-in-out infinite;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            top: -10%;
            left: 5%;
            background: radial-gradient(circle, rgba(138, 77, 122, 0.4) 0%, transparent 70%);
            animation-duration: 10s;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            bottom: -15%;
            right: 0%;
            background: radial-gradient(circle, rgba(240, 154, 91, 0.5) 0%, transparent 70%);
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .glow-3 {
            width: 450px;
            height: 450px;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(193, 114, 135, 0.3) 0%, transparent 70%);
            animation-duration: 15s;
            animation-delay: 6s;
        }

        /* Étoiles scintillantes */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: twinkle ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .star-1 { top: 8%; left: 12%; animation-duration: 4s; animation-delay: 0s; }
        .star-2 { top: 15%; left: 88%; animation-duration: 3.5s; animation-delay: 0.5s; }
        .star-3 { top: 25%; left: 25%; animation-duration: 4.5s; animation-delay: 1s; }
        .star-4 { top: 35%; left: 70%; animation-duration: 3.8s; animation-delay: 1.5s; }
        .star-5 { top: 12%; left: 45%; animation-duration: 4.2s; animation-delay: 0.8s; }
        .star-6 { top: 20%; left: 60%; animation-duration: 3.6s; animation-delay: 1.2s; }
        .star-7 { top: 10%; left: 75%; animation-duration: 4.3s; animation-delay: 2s; }
        .star-8 { top: 28%; left: 40%; animation-duration: 3.9s; animation-delay: 2.5s; }

        /* Planètes / Lune */
        @keyframes moonGlow {
            0%, 100% {
                box-shadow:
                    0 0 40px rgba(255, 250, 220, 0.6),
                    0 0 80px rgba(255, 250, 220, 0.4),
                    0 0 120px rgba(255, 250, 220, 0.2);
            }
            50% {
                box-shadow:
                    0 0 60px rgba(255, 250, 220, 0.8),
                    0 0 120px rgba(255, 250, 220, 0.6),
                    0 0 180px rgba(255, 250, 220, 0.3);
            }
        }

        @keyframes sunGlow {
            0%, 100% {
                box-shadow:
                    0 0 60px rgba(255, 223, 0, 0.8),
                    0 0 120px rgba(255, 223, 0, 0.6),
                    0 0 180px rgba(255, 223, 0, 0.4);
            }
            50% {
                box-shadow:
                    0 0 80px rgba(255, 223, 0, 1),
                    0 0 160px rgba(255, 223, 0, 0.8),
                    0 0 240px rgba(255, 223, 0, 0.5);
            }
        }

        .celestial-body {
            position: absolute;
            width: 120px;
            height: 120px;
            top: 15%;
            right: 15%;
            border-radius: 50%;
            z-index: 2;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .celestial-body:hover {
            transform: scale(1.1);
        }

        .celestial-body:active {
            transform: scale(0.95);
        }

        /* Lune par défaut */
        body:not(.light-theme) .celestial-body {
            background: radial-gradient(circle at 35% 35%, #fffaf0 0%, #f5e6d3 50%, #d4c4a8 100%);
            animation: moonGlow 5s ease-in-out infinite;
        }

        body:not(.light-theme) .celestial-body::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            top: 25%;
            left: 20%;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
        }

        body:not(.light-theme) .celestial-body::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            bottom: 30%;
            right: 25%;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 50%;
        }

        /* Soleil en thème clair */
        body.light-theme .celestial-body {
            background: radial-gradient(circle, #ffeb3b 0%, #ffd700 50%, #ffa500 100%);
            animation: sunGlow 3s ease-in-out infinite;
        }

        body.light-theme .celestial-body::before,
        body.light-theme .celestial-body::after {
            display: none;
        }

        /* Contenu principal */
        .content {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            position: relative;
        }

        .content > * {
            animation-fill-mode: both;
        }

        /* Titre principal */
        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 300;
            color: #fff;
            text-shadow:
                2px 2px 30px rgba(240, 154, 91, 0.8),
                0 0 40px rgba(255, 200, 100, 0.6),
                0 0 80px rgba(255, 150, 50, 0.4),
                -2px -2px 30px rgba(193, 114, 135, 0.5);
            margin-bottom: 1.5rem;
            letter-spacing: 0.15em;
            background: linear-gradient(
                90deg,
                rgba(255, 230, 180, 0.9) 0%,
                rgba(255, 200, 150, 1) 25%,
                rgba(255, 180, 120, 1) 50%,
                rgba(255, 200, 150, 1) 75%,
                rgba(255, 230, 180, 0.9) 100%
            );
            background-size: 300% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                fadeInDown 2s ease-out,
                shimmer 4s linear infinite,
                floatGentle 6s ease-in-out 2s infinite;
        }

        .tagline {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: rgba(255, 220, 180, 0.95);
            font-weight: 300;
            margin-bottom: 3rem;
            text-shadow:
                1px 1px 20px rgba(240, 154, 91, 0.5),
                0 0 30px rgba(255, 200, 100, 0.3);
            animation:
                fadeInUp 2s ease-out 0.4s both,
                floatGentle 6s ease-in-out 2.5s infinite;
        }

        .download-button {
            padding: 1.2rem 3rem;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            background: linear-gradient(135deg, rgba(240, 154, 91, 0.95) 0%, rgba(193, 114, 135, 0.95) 100%);
            color: #fff;
            border: 2px solid rgba(255, 220, 180, 0.5);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow:
                0 10px 40px rgba(240, 154, 91, 0.4),
                0 0 30px rgba(240, 154, 91, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-weight: 600;
            margin-bottom: 1rem;
            animation:
                fadeInUp 2s ease-out 0.8s both,
                floatGentle 6s ease-in-out 3s infinite,
                pulse 3s ease-in-out 4s infinite;
            position: relative;
            overflow: hidden;
        }

        .download-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .download-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .download-button:hover {
            transform: translateY(-10px) scale(1.1);
            box-shadow:
                0 20px 60px rgba(240, 154, 91, 0.6),
                0 0 50px rgba(240, 154, 91, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 220, 180, 0.9);
            animation-play-state: paused;
        }

        .download-button:active {
            transform: translateY(-5px) scale(1.05);
        }

        .version {
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            color: rgba(255, 220, 180, 0.7);
            margin-top: 0.5rem;
            animation: fadeInUp 2s ease-out 1.2s both;
            text-shadow: 0 0 10px rgba(240, 154, 91, 0.3);
        }

        /* ============================================ */
        /* THÈME CLAIR - JOUR */
        /* ============================================ */

        body.light-theme::before {
            background: linear-gradient(
                180deg,
                #87ceeb 0%,
                #a4d8f5 20%,
                #b8e0f7 40%,
                #d0ebff 60%,
                #e8f4ff 80%,
                #f0f8ff 100%
            );
        }

        /* Nuages blancs en thème clair */
        body.light-theme .cloud {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 -5px 20px rgba(200, 200, 200, 0.2);
        }

        body.light-theme .cloud::before,
        body.light-theme .cloud::after {
            background: rgba(255, 255, 255, 0.7);
        }

        /* Oiseaux sombres pour le jour */
        body.light-theme .bird::before,
        body.light-theme .bird::after {
            background: rgba(0, 0, 0, 0.4);
        }

        /* Particules dorées plus subtiles */
        body.light-theme .particle {
            background: radial-gradient(circle, rgba(255, 230, 100, 0.6) 0%, rgba(255, 200, 50, 0.3) 100%);
            box-shadow: 0 0 10px rgba(255, 220, 100, 0.4);
        }

        /* Lucioles invisibles en plein jour */
        body.light-theme .firefly {
            display: none;
        }

        /* Étoiles invisibles en plein jour */
        body.light-theme .star {
            display: none;
        }

        /* Lueurs plus douces et bleues pour le jour */
        body.light-theme .glow-1 {
            background: radial-gradient(circle, rgba(135, 206, 250, 0.3) 0%, transparent 70%);
        }

        body.light-theme .glow-2 {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
        }

        body.light-theme .glow-3 {
            background: radial-gradient(circle, rgba(173, 216, 230, 0.25) 0%, transparent 70%);
        }

        /* Brume plus claire */
        body.light-theme .mist {
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
        }

        /* Texte adapté au thème clair */
        body.light-theme h1 {
            text-shadow:
                2px 2px 20px rgba(135, 206, 250, 0.6),
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 50px rgba(135, 206, 250, 0.4);
            background: linear-gradient(
                90deg,
                rgba(100, 150, 255, 0.9) 0%,
                rgba(135, 206, 250, 1) 25%,
                rgba(100, 180, 255, 1) 50%,
                rgba(135, 206, 250, 1) 75%,
                rgba(100, 150, 255, 0.9) 100%
            );
            background-size: 300% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.light-theme .tagline {
            color: rgba(70, 130, 180, 0.95);
            text-shadow:
                1px 1px 15px rgba(135, 206, 250, 0.5),
                0 0 25px rgba(255, 255, 255, 0.6);
        }

        body.light-theme .download-button {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.95) 0%, rgba(135, 206, 250, 0.95) 100%);
            border-color: rgba(135, 206, 250, 0.7);
            box-shadow:
                0 10px 40px rgba(100, 150, 255, 0.4),
                0 0 30px rgba(135, 206, 250, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        body.light-theme .download-button:hover {
            box-shadow:
                0 20px 60px rgba(100, 150, 255, 0.6),
                0 0 50px rgba(135, 206, 250, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border-color: rgba(135, 206, 250, 1);
        }

        body.light-theme .version {
            color: rgba(70, 130, 180, 0.8);
            text-shadow: 0 0 10px rgba(135, 206, 250, 0.3);
        }

        /* Transition fluide entre les thèmes */
        body,
        body::before,
        .cloud,
        .cloud::before,
        .cloud::after,
        .bird::before,
        .bird::after,
        .particle,
        .glow,
        .mist,
        h1,
        .tagline,
        .download-button,
        .version {
            transition: all 0.8s ease-in-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                padding: 1rem;
            }

            .download-button {
                padding: 1rem 2rem;
            }

            .bird,
            .glow,
            .celestial-body {
                display: none;
            }

            .mist {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Lune / Soleil (cliquable) -->
    <div class="celestial-body" onclick="toggleTheme()"></div>

    <!-- Lueurs crépusculaires -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- Brume -->
    <div class="mist mist-1"></div>
    <div class="mist mist-2"></div>
    <div class="mist mist-3"></div>

    <!-- Nuages sombres -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- Particules dorées -->
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>
    <div class="particle particle-6"></div>
    <div class="particle particle-7"></div>
    <div class="particle particle-8"></div>

    <!-- Lucioles -->
    <div class="firefly firefly-1"></div>
    <div class="firefly firefly-2"></div>
    <div class="firefly firefly-3"></div>
    <div class="firefly firefly-4"></div>
    <div class="firefly firefly-5"></div>
    <div class="firefly firefly-6"></div>
    <div class="firefly firefly-7"></div>
    <div class="firefly firefly-8"></div>

    <!-- Oiseaux -->
    <div class="bird bird-1"></div>
    <div class="bird bird-2"></div>
    <div class="bird bird-3"></div>

    <!-- Étoiles -->
    <div class="star star-1"></div>
    <div class="star star-2"></div>
    <div class="star star-3"></div>
    <div class="star star-4"></div>
    <div class="star star-5"></div>
    <div class="star star-6"></div>
    <div class="star star-7"></div>
    <div class="star star-8"></div>

    <!-- Contenu principal -->
    <div class="content">
        <h1>Wind Rises</h1>
        <p class="tagline">Laissez-vous porter par le vent</p>
        <a href="WindRisesWindows.zip" class="download-button" download>
            Télécharger
        </a>
        <p class="version">Version Windows</p>
    </div>

    <script>
        // Détecter la préférence système pour le thème avant le chargement
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.body.classList.add('light-theme');
            }
        })();

        // Fonction pour basculer entre les thèmes
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        // Initialisation optimisée au chargement
        window.addEventListener('DOMContentLoaded', () => {
            // Réduire les animations si préférence utilisateur
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return; // Skip animations
            }

            // Cache des éléments pour performance
            const particles = document.querySelectorAll('.particle, .firefly');
            if (particles.length === 0) return;

            let mouseX = 0, mouseY = 0;
            let currentX = 0, currentY = 0;
            let rafId = null;

            // Throttle mousemove avec requestAnimationFrame
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 20;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 20;
            }, { passive: true });

            // Animation loop optimisée
            function animate() {
                const deltaX = mouseX - currentX;
                const deltaY = mouseY - currentY;

                // Stop animation si mouvement minimal
                if (Math.abs(deltaX) < 0.01 && Math.abs(deltaY) < 0.01) {
                    rafId = null;
                    return;
                }

                currentX += deltaX * 0.05;
                currentY += deltaY * 0.05;

                // Batch DOM updates
                particles.forEach((particle, index) => {
                    const speed = (index % 3 + 1) * 0.3;
                    particle.style.transform = `translate(${currentX * speed}px, ${currentY * speed}px)`;
                });

                rafId = requestAnimationFrame(animate);
            }

            // Start animation on first mouse move
            document.addEventListener('mousemove', () => {
                if (!rafId) {
                    rafId = requestAnimationFrame(animate);
                }
            }, { once: true, passive: true });
        });
    </script>
</body>
</html>
